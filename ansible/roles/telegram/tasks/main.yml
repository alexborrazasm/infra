---
- name: Install the notify-telegram script
  ansible.builtin.template:
    src: notify-telegram.j2
    dest: /usr/local/bin/notify-telegram
    owner: root
    group: root
    mode: "0755"

- name: Install the failure-notification unit template
  # Any unit can use it: OnFailure=telegram-notify@%n.service
  ansible.builtin.template:
    src: telegram-notify@.service.j2
    dest: "/etc/systemd/system/telegram-notify@.service"
    owner: root
    group: root
    mode: "0644"
  register: _telegram_unit

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true
  when: _telegram_unit is changed

- name: Store the bot credentials
  when:
    - telegram_bot_token | length > 0
    - telegram_chat_id | length > 0
  no_log: true
  ansible.builtin.copy:
    dest: "{{ telegram_env_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      TELEGRAM_BOT_TOKEN="{{ telegram_bot_token }}"
      TELEGRAM_CHAT_ID="{{ telegram_chat_id }}"

- name: Remind that Telegram is not configured
  when: telegram_bot_token | length == 0 or telegram_chat_id | length == 0
  ansible.builtin.debug:
    msg: "Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in ansible/.env to get notifications."
