---
- name: Add the Tailscale repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/tailscale.repo"
    dest: /etc/yum.repos.d/tailscale.repo
    owner: root
    group: root
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
    update_cache: true

- name: Enable IP forwarding (needed for exit nodes and subnet routers)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: tailscale_exit_node | bool

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Read the current Tailscale state
  ansible.builtin.command: tailscale status --json
  register: _ts_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Work out whether the node is already in the tailnet
  ansible.builtin.set_fact:
    _ts_running: "{{ (_ts_status.stdout | from_json).BackendState | default('') == 'Running' if _ts_status.stdout else false }}"

- name: Join the tailnet (pre-auth keys are single-use)
  # no_log: the key is on the command line for a moment.
  when:
    - not _ts_running
    - tailscale_authkey | length > 0
    - tailscale_login_server | length > 0
  no_log: true
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--login-server={{ tailscale_login_server }}"
      - "--authkey={{ tailscale_authkey }}"
      - "--hostname={{ inventory_hostname }}"
      - "--accept-dns={{ tailscale_accept_dns | lower }}"
      - "--advertise-exit-node={{ tailscale_exit_node | lower }}"

- name: Read the current Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: _ts_prefs
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set the exit node preference
  # "0.0.0.0/0" in AdvertiseRoutes is how Tailscale stores "exit node".
  when:
    - _ts_prefs.rc == 0
    - ('0.0.0.0/0' in _ts_prefs.stdout) != (tailscale_exit_node | bool)
  ansible.builtin.command: "tailscale set --advertise-exit-node={{ tailscale_exit_node | lower }}"

- name: Remind that the node has not joined
  when:
    - not _ts_running
    - tailscale_authkey | length == 0 or tailscale_login_server | length == 0
  ansible.builtin.debug:
    msg: >-
      Tailscale is installed but not joined. Set TS_LOGIN_SERVER and TS_AUTHKEY
      in ansible/.env
