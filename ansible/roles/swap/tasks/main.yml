---
# AlmaLinux cloud images ship with zero swap. Gated on "no swap already
# active" as a plain idempotency check.
- name: Check for existing active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: _swap_check
  changed_when: false
  check_mode: false

- name: Create and enable a swap file
  when:
    - _swap_check.stdout | trim == ""
    - swap_mb | int > 0
  block:
    - name: Allocate the swap file
      ansible.builtin.command: "fallocate -l {{ swap_mb }}M /swapfile"
      args:
        creates: /swapfile
      register: _swap_alloc

    - name: Set swap file permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
        owner: root
        group: root

    - name: Format the swap file
      ansible.builtin.command: mkswap /swapfile
      when: _swap_alloc is changed

    - name: Enable the swap file
      ansible.builtin.command: swapon /swapfile

    - name: Persist the swap file in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
